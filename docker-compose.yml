version: '3.8'

services:
  smart-kirana:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-kirana-pos
    restart: unless-stopped
    ports:
      - "3005:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
