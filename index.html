<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Smart Kirana POS, Inventory & Udhari</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-orange-100 selection:text-orange-900">
    <div id="root"></div>
    <script>
      // Automatically refresh when a new service worker takes control
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }

      // Safety fallback: if an uncaught error prevents root from rendering within 3 seconds
      window.addEventListener('error', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
            root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;background:#0f172a;color:#f8fafc;">' +
              '<div style="width:56px;height:56px;border-radius:14px;background:#10b981;display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 10px 25px -5px rgba(16,185,129,0.3);">' +
                '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>' +
              '</div>' +
              '<h2 style="font-size:22px;font-weight:700;margin:0 0 8px 0;letter-spacing:-0.02em;">New App Version Available</h2>' +
              '<p style="color:#94a3b8;font-size:14px;max-width:380px;line-height:1.5;margin:0 0 24px 0;">An older offline cache was detected in your browser. Tap below to load the latest Smart Kirana release.</p>' +
              '<button onclick="if(\x27serviceWorker\x27 in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){for(var reg of regs){reg.unregister();}});}if(\x27caches\x27 in window){caches.keys().then(function(keys){for(var k of keys){caches.delete(k);}});}window.location.reload(true);" style="padding:12px 28px;background:#10b981;color:#ffffff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px 0 rgba(16,185,129,0.39);transition:all 0.2s;">Update &amp; Open Store</button>' +
            '</div>';
          }
        }, 1500);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
